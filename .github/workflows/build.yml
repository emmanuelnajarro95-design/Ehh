name: Crear APK JE2BE Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: Compilar JE2BE Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar NDK, CMake y plataforma Android
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Preparar y localizar el proyecto
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          # Caso 1: el proyecto ya está extraído en la raíz.
          if [ -f "$ROOT/settings.gradle.kts" ] || [ -f "$ROOT/settings.gradle" ]; then
            PROJECT_DIR="$ROOT"
          else
            # Caso 2: el repositorio contiene el ZIP del proyecto.
            ZIP="$ROOT/je2be-android-recompilacion.zip"
            if [ ! -f "$ZIP" ]; then
              ZIP="$ROOT/je2be-android-actualizado.zip"
            fi
            if [ ! -f "$ZIP" ]; then
              ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'je2be-android*.zip' -print -quit)"
            fi

            if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
              echo "ERROR: No hay proyecto Gradle ni ZIP je2be-android*.zip en la raíz."
              ls -la "$ROOT"
              exit 1
            fi

            DEST="$RUNNER_TEMP/je2be-source"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            echo "Extrayendo: $ZIP"
            unzip -q "$ZIP" -d "$DEST"

            SETTINGS="$(find "$DEST" -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' -print -quit)"

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: El ZIP no contiene settings.gradle.kts ni settings.gradle."
              find "$DEST" -maxdepth 4 -type f | sort | head -150
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Se encontró Gradle, pero falta app/build.gradle.kts"
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort | head -150
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt" ]; then
            echo "ERROR: Falta app/src/main/cpp/CMakeLists.txt"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto listo en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug ARM64
        run: gradle -p "${{ steps.project.outputs.PROJECT_DIR }}" :app:assembleDebug --no-daemon --stacktrace

      - name: Ejecutar pruebas unitarias
        run: gradle -p "${{ steps.project.outputs.PROJECT_DIR }}" :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verificar APK y biblioteca JNI
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.project.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libje2be_jni.so'
          echo "APK generado y biblioteca ARM64 encontrada."
          sha256sum "$APK"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: JE2BE-Android-ARM64-debug
          path: ${{ steps.project.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
